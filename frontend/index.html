<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ECO AI – Yapay zekâ destekli akıllı geri dönüşüm asistanı" />
    <title>ECO AI – Akıllı Geri Dönüşüm Asistanı</title>
    <script>
      // Sayfa çizilmeden önce tema uygulanır; böylece karanlık modda beyaz "flaş" olmaz.
      try {
        const saved = localStorage.getItem('eco-ai-theme')
        const dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches
        if (dark) document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
